<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Start with an opaque iOS status bar; useTheme syncs black/default with the app theme. -->
    <meta content="black" name="apple-mobile-web-app-status-bar-style" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
    <meta content="#F2F3F5" media="(prefers-color-scheme: light)" name="theme-color" />
    <meta content="#2E2E30" media="(prefers-color-scheme: dark)" name="theme-color" />
    <meta name="description" content="A Simple but Powerful RSS Reader for Miniflux" />
    <meta name="referrer" content="no-referrer" />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="stylesheet" href="/styles/loading.css" />
    <link rel="stylesheet" href="/styles/fonts.css" />
    <title>ReactFlux</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div aria-hidden="true" class="pwa-status-bar"></div>
    <div class="spinner">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

<script>
(() => {
  if (!new URLSearchParams(location.search).has("translation-trace")) return;

  const selectors = { heading: ".article-title", body: ".article-body" };
  const comparePane = new URLSearchParams(location.search).has("translation-pane");
  const compareScroll = new URLSearchParams(location.search).has("translation-scroll");
  const previous = {};
  let probeBody;
  let outsideProbe;
  let scrollSiblingProbe;
  let probeIndex = 0;
  const probeText = [
    "Public libraries will stay open later to give students more time to study.",
    "Volunteers repaired the wooden bridges so visitors can walk to the lighthouse again.",
  ];

  function makeProbe(label, text) {
    const element = document.createElement("p");
    const caption = document.createElement("strong");
    caption.translate = false;
    caption.textContent = label + " ";
    const sample = document.createElement("span");
    sample.textContent = text;
    element.append(caption, sample);
    return element;
  }

  function compareLocations() {
    const body = document.querySelector(".article-body");
    if (!body || body === probeBody) return;
    probeBody = body;
    const text = probeText[probeIndex++ % probeText.length];
    const inside = makeProbe(compareScroll ? "A（スクロール領域内）" : "A（ペイン内）", text);
    inside.id = "translation-pane-inside";
    const outside = makeProbe("B（ペイン外）", text);
    outside.id = "translation-pane-outside";
    outside.style.cssText =
      "position:fixed;right:10px;top:48px;width:min(300px,85vw);padding:8px;background:#fff;color:#111;z-index:1000";
    body.prepend(inside);
    const scroller = body.closest(".scroll-container");
    if (compareScroll && scroller) {
      const sibling = makeProbe("C（ペイン内・スクロール領域外）", text);
      sibling.id = "translation-scroll-sibling";
      sibling.style.cssText = "margin:0 auto;padding:4px 8px;max-width:680px";
      scrollSiblingProbe?.remove();
      scroller.before(sibling);
      scrollSiblingProbe = sibling;
    }
    if (outsideProbe) outsideProbe.replaceWith(outside);
    else document.body.append(outside);
    outsideProbe = outside;
  }
  const events = [];
  if (comparePane) {
    selectors.inside = "#translation-pane-inside";
    selectors.outside = "#translation-pane-outside";
    if (compareScroll) selectors.scrollSibling = "#translation-scroll-sibling";
  }
  const started = performance.now();
  let route = location.pathname;
  let translated;
  const output = document.createElement("textarea");
  output.readOnly = true;
  output.rows = 7;
  output.setAttribute("aria-label", "翻訳診断ログ");

  function record(message) {
    events.push(Math.round(performance.now() - started) + " ms | " + message);
    if (events.length > 150) events.shift();
    output.value = events.join("\n");
    output.scrollTop = output.scrollHeight;
  }

  function inspect(records) {
    if (comparePane) compareLocations();
    if (route !== location.pathname) {
      route = location.pathname;
      record("navigation");
    }
    const root = document.documentElement;
    const isTranslated = root.matches(".translated-ltr, .translated-rtl");
    if (translated !== isTranslated) {
      translated = isTranslated;
      record("translation marker " + (translated ? "on" : "off"));
    }
    for (const [name, selector] of Object.entries(selectors)) {
      const node = document.querySelector(selector);
      const old = previous[name];
      const fonts = node?.querySelectorAll("font").length ?? 0;
      const changes = records.filter(({ target }) =>
        node?.contains(target) || old?.contains(target)
      ).length;
      if (old !== node) {
        previous[name] = node;
        record(name + (node ? " mounted" : " removed") + " | font " + fonts);
      }
      if (changes) record(name + " changes " + changes + " | font " + fonts);
    }
  }

  const observer = new MutationObserver(inspect);
  observer.observe(comparePane ? document.body : document.getElementById("root"), {
    subtree: true, childList: true, characterData: true,
  });
  observer.observe(document.documentElement, {
    attributes: true, attributeFilter: ["class", "lang"],
  });
  record("ReactFlux trace ready");
  inspect([]);

  const panel = document.createElement("details");
  panel.translate = false;
  panel.style.cssText =
    "position:fixed;bottom:8px;left:8px;z-index:2147483647;background:#202124;color:#fff;padding:8px;border:1px solid #aaa;border-radius:6px";
  const title = document.createElement("summary");
  title.textContent = "翻訳診断ログ";
  output.style.cssText = "display:block;width:min(440px,85vw);color:#111;background:#fff";
  panel.append(title, output);
  document.body.append(panel);
})();
</script>    <script type="module" src="/src/main.jsx"></script>
